name: unit-tests

on:
  pull_request:
  push:
    branches:
      - main
      - release**

jobs:
  GrAITests:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - name: Build
        run: swift build
      - name: Test
        run: swift test -c release --filter GrAITests
